<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="rgb(104, 94, 105)"><title>美研社 · 四季穿搭试色间</title><meta property="og:title" content="美研社 · 四季穿搭试色间"><link rel="stylesheet" href="style.css?v=9"><script defer src="clmtrackr.min.js"></script><script defer src="face.js?v=9"></script><script defer src="app.js?v=9"></script><script defer src="photo.js?v=6"></script></head>
<body><header><div class="bar"><a class="brand" href="#"><span class="bloom">✽</span>美研社 <small>CHROMA ATELIER</small></a></div></header>
<main><section class="intro"><div class="kicker"><i></i> SEASONAL COLOR STUDIO</div><h1>四季穿搭试色间<span>.</span></h1><p>圈出脸部和发型，试穿四季配色，看看哪一季最衬你。</p></section>
<div class="studio"><section class="print"><div class="print-head"><span><b class="live"></b> 试色预览</span><span class="mono" id="sample">示例人像</span></div><div class="canvas" id="canvas"><img id="example" src="spring-example.jpg" alt="春季穿搭示例，模特保留完整发型"><img hidden id="portrait" src="spring-example.jpg" alt="用于圈选脸部的原照片"><div id="look" hidden><div id="fittingPlane"><div id="neck" aria-hidden="true"></div><canvas id="face" aria-label="拖动调整脸部位置"></canvas></div></div><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div><button id="startCut" class="upload" hidden>继续圈选头部</button><div class="fit" hidden><label>脸部大小 <input id="scale" type="range" min="55" max="180" value="100"></label><button id="outline">调整轮廓</button><span>拖动脸部可调整位置</span></div><div class="print-foot"><em id="plate">Spring</em><span class="dots" id="dots"></span></div></section>
<section class="control"><div class="season-mark" id="symbol">✿</div><div class="kicker" id="english">SPRING PALETTE</div><h2 id="name">明媚春季</h2><p id="description"></p><div id="tags" class="tags"></div><div class="minihead" id="paletteTitle">春季色卡</div><div id="swatches"></div><button class="upload" id="upload"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg><span>上传我的照片</span></button><p class="privacy">照片仅在你的设备上处理</p></section></div>
<section class="seasons"><div class="section-head"><h2>切换季节</h2><span>选择季节，切换穿搭</span></div><div class="choices" id="choices"></div></section></main>

<dialog id="editor"><h2>调整抠图轮廓</h2><p>轮廓合适就直接确认，也可以拖动控制点微调发梢和下巴。</p><canvas id="maskEdit"></canvas><div class="editor-actions"><button id="cancelEdit">稍后调整</button><button id="saveEdit">确认轮廓</button></div></dialog><input hidden type="file" id="file" accept="image/*"><div id="notice" role="status"></div></body></html>
